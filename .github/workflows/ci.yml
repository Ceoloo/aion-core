name: CI

on:
  push:
    branches: [main]
  pull_request:

# Phase 1 is a library/kernel: install → lint → typecheck → test → build.
# There is no deployment stage — Phase 1 has nothing to deploy.
jobs:
  build:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
